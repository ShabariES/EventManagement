<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QuantrixConduct</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Protect dashboard - require admin access
        window.addEventListener('DOMContentLoaded', () => {
            if (!auth.requireLogin('login.html')) return;
            if (!auth.requireAdmin('../index.html')) return;
        });
    </script>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Color Palette */
            --primary: #3225eb;
            --primary-dark: #1D4ED8;
            --primary-light: #3B82F6;
            --secondary: #7C3AED;
            --secondary-dark: #6D28D9;
            --accent: #F59E0B;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --neutral: #6B7280;
            --neutral-light: #9CA3AF;
            --neutral-dark: #374151;
            --background: #F9FAFB;
            --background-dark: #F3F4F6;
            --text: #111827;
            --text-light: #6B7280;
            --white: #FFFFFF;
            --border: #E5E7EB;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-lg: rgba(0, 0, 0, 0.15);

            /* Typography */
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-secondary: 'Poppins', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Font Sizes */
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            --text-4xl: 2.25rem;
            --text-5xl: 3rem;

            /* Spacing */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-16: 4rem;
            --space-20: 5rem;
            --space-24: 6rem;

            /* Border Radius */
            --radius-sm: 0.25rem;
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;

            /* Transitions */
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: var(--font-primary);
            font-size: var(--text-base);
            line-height: 1.6;
            color: var(--text);
            background-color: var(--white);
            overflow-x: hidden;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-6);
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            transition: var(--transition);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-family: var(--font-secondary);
            font-weight: 600;
            font-size: var(--text-xl);
            color: var(--primary);
            text-decoration: none;
        }

        .nav-logo i {
            font-size: var(--text-2xl);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: var(--space-8);
        }

        .nav-link {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: var(--transition);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: var(--space-1);
        }

        .bar {
            width: 25px;
            height: 3px;
            background: var(--text);
            transition: var(--transition);
        }

        /* Hero Section */
        .hero {
            padding: 120px 0 var(--space-24);
            background: linear-gradient(135deg, var(--background) 0%, #EEF2FF 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%23E5E7EB" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-6);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-16);
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            animation: fadeInUp 0.8s ease-out;
        }

        .hero-title {
            font-family: var(--font-secondary);
            font-size: var(--text-5xl);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: var(--space-6);
            color: var(--text);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-description {
            font-size: var(--text-xl);
            color: var(--text-light);
            margin-bottom: var(--space-8);
            line-height: 1.7;
        }

        .hero-buttons {
            display: flex;
            gap: var(--space-4);
            margin-bottom: var(--space-12);
        }

        .hero-stats {
            display: flex;
            gap: var(--space-8);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-family: var(--font-secondary);
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: var(--text-sm);
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            animation: fadeInRight 0.8s ease-out 0.2s both;
        }

        .hero-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 40px var(--shadow-lg);
            padding: var(--space-6);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border);
        }

        .card-header i {
            color: var(--primary);
            font-size: var(--text-xl);
        }

        .card-header span {
            font-weight: 600;
            color: var(--text);
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--border);
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .event-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .event-dot.active {
            background: var(--success);
        }

        .event-dot.pending {
            background: var(--warning);
        }

        .event-dot.completed {
            background: var(--neutral);
        }

        .event-status {
            margin-left: auto;
            font-size: var(--text-sm);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius);
            background: var(--background);
            color: var(--text-light);
        }

        /* Sections */
        .section-header {
            text-align: center;
            margin-bottom: var(--space-16);
        }

        .section-title {
            font-family: var(--font-secondary);
            font-size: var(--text-4xl);
            font-weight: 700;
            color: var(--text);
            margin-bottom: var(--space-4);
        }

        .section-description {
            font-size: var(--text-xl);
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Features Section */
        .features {
            padding: var(--space-24) 0;
            background: var(--white);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: var(--space-8);
        }

        .feature-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            transform: scaleX(0);
            transition: var(--transition);
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px var(--shadow-lg);
        }

        .feature-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-6);
            color: var(--white);
            font-size: var(--text-3xl);
        }

        .feature-title {
            font-family: var(--font-secondary);
            font-size: var(--text-2xl);
            font-weight: 600;
            color: var(--text);
            margin-bottom: var(--space-4);
        }

        .feature-description {
            color: var(--text-light);
            line-height: 1.7;
        }

        /* Events Section */
        .events {
            padding: var(--space-24) 0;
            background: var(--background);
        }

        .events-filters {
            display: flex;
            justify-content: center;
            gap: var(--space-4);
            margin-bottom: var(--space-12);
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: var(--space-3) var(--space-6);
            border: 2px solid var(--border);
            background: var(--white);
            color: var(--text);
            border-radius: var(--radius-lg);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--white);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: var(--space-8);
        }

        .events-empty {
            text-align: center;
            padding: var(--space-16);
            color: var(--text-light);
        }

        .events-empty i {
            font-size: var(--text-5xl);
            margin-bottom: var(--space-6);
            color: var(--neutral-light);
        }

        .events-empty h3 {
            font-size: var(--text-2xl);
            margin-bottom: var(--space-4);
            color: var(--text);
        }

        /* About Section */
        .about {
            padding: var(--space-24) 0;
            background: var(--white);
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-16);
            align-items: center;
        }

        .about-description {
            font-size: var(--text-lg);
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: var(--space-8);
        }

        .about-features {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .about-feature {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .about-feature i {
            color: var(--success);
            font-size: var(--text-lg);
        }

        .about-visual {
            display: flex;
            justify-content: center;
        }

        .about-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            padding: var(--space-8);
            border-radius: var(--radius-xl);
            text-align: center;
            max-width: 300px;
        }

        .card-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-6);
            font-size: var(--text-3xl);
        }

        .about-card h3 {
            font-family: var(--font-secondary);
            font-size: var(--text-2xl);
            margin-bottom: var(--space-4);
        }

        .about-card p {
            opacity: 0.9;
            line-height: 1.6;
        }

        /* Footer */
        .footer {
            background: var(--text);
            color: var(--white);
            padding: var(--space-16) 0 var(--space-8);
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--space-8);
            margin-bottom: var(--space-8);
        }

        .footer-logo {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-family: var(--font-secondary);
            font-weight: 600;
            font-size: var(--text-xl);
            margin-bottom: var(--space-4);
        }

        .footer-logo i {
            font-size: var(--text-2xl);
            color: var(--primary);
        }

        .footer-description {
            color: var(--neutral-light);
            line-height: 1.6;
        }

        .footer-title {
            font-family: var(--font-secondary);
            font-weight: 600;
            margin-bottom: var(--space-4);
        }

        .footer-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .footer-links a {
            color: var(--neutral-light);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--white);
        }

        .footer-contact p {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-2);
            color: var(--neutral-light);
        }

        .footer-contact i {
            color: var(--primary);
        }

        .footer-bottom {
            text-align: center;
            padding-top: var(--space-8);
            border-top: 1px solid var(--neutral-dark);
            color: var(--neutral-light);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Utility Classes */
        .text-center {
            text-align: center;
        }

        .text-left {
            text-align: left;
        }

        .text-right {
            text-align: right;
        }

        .mb-4 {
            margin-bottom: var(--space-4);
        }

        .mb-6 {
            margin-bottom: var(--space-6);
        }

        .mb-8 {
            margin-bottom: var(--space-8);
        }

        .mt-4 {
            margin-top: var(--space-4);
        }

        .mt-6 {
            margin-top: var(--space-6);
        }

        .mt-8 {
            margin-top: var(--space-8);
        }

        /* Button Components */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-6);
            border: none;
            border-radius: var(--radius-lg);
            font-family: var(--font-primary);
            font-weight: 500;
            font-size: var(--text-base);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
        }

        .btn-tertiary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-tertiary:hover {
            background: var(--background);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning) 0%, #D97706 100%);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-error {
            background: linear-gradient(135deg, var(--error) 0%, #DC2626 100%);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-error:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        /* Button Sizes */
        .btn-small {
            padding: var(--space-2) var(--space-4);
            font-size: var(--text-sm);
        }

        .btn-large {
            padding: var(--space-4) var(--space-8);
            font-size: var(--text-lg);
        }

        .btn-block {
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Card Components */
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 10px 30px var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card-header {
            padding: var(--space-6);
            border-bottom: 1px solid var(--border);
            background: var(--background);
        }

        .card-title {
            font-family: var(--font-secondary);
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--text);
            margin: 0;
        }

        .card-subtitle {
            color: var(--text-light);
            font-size: var(--text-sm);
            margin-top: var(--space-1);
        }

        .card-body {
            padding: var(--space-6);
        }

        .card-footer {
            padding: var(--space-6);
            border-top: 1px solid var(--border);
            background: var(--background);
        }

        /* Event Card */
        .event-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px var(--shadow-lg);
        }

        .event-card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: var(--text-4xl);
            position: relative;
            overflow: hidden;
        }

        .event-card-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="3" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
        }

        .event-card-content {
            padding: var(--space-6);
        }

        .event-card-category {
            display: inline-block;
            padding: var(--space-1) var(--space-3);
            background: var(--primary);
            color: var(--white);
            font-size: var(--text-xs);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: var(--radius);
            margin-bottom: var(--space-4);
        }

        .event-card-title {
            font-family: var(--font-secondary);
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--text);
            margin-bottom: var(--space-3);
            line-height: 1.3;
        }

        .event-card-description {
            color: var(--text-light);
            font-size: var(--text-sm);
            line-height: 1.6;
            margin-bottom: var(--space-4);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .event-card-meta {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            margin-bottom: var(--space-6);
        }

        .event-meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
            color: var(--text-light);
        }

        .event-meta-item i {
            color: var(--primary);
            width: 16px;
        }

        .event-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
        }

        .event-card-price {
            font-family: var(--font-secondary);
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--success);
        }

        .event-card-price.free {
            color: var(--primary);
        }

        /* Form Components */
        .form-group {
            margin-bottom: var(--space-6);
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: var(--text);
            margin-bottom: var(--space-2);
            font-size: var(--text-sm);
        }

        .form-label.required::after {
            content: ' *';
            color: var(--error);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            font-family: var(--font-primary);
            font-size: var(--text-base);
            color: var(--text);
            background: var(--white);
            transition: var(--transition);
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-input.error,
        .form-select.error,
        .form-textarea.error {
            border-color: var(--error);
        }

        .form-input.error:focus,
        .form-select.error:focus,
        .form-textarea.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-error {
            color: var(--error);
            font-size: var(--text-sm);
            margin-top: var(--space-1);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .form-help {
            color: var(--text-light);
            font-size: var(--text-sm);
            margin-top: var(--space-1);
        }

        .form-checkbox,
        .form-radio {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .form-checkbox input,
        .form-radio input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        /* Modal Components */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--white);
            border-radius: var(--radius-xl);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: var(--space-6);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-family: var(--font-secondary);
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--text);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: var(--text-xl);
            color: var(--text-light);
            cursor: pointer;
            padding: var(--space-2);
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--background);
            color: var(--text);
        }

        .modal-body {
            padding: var(--space-6);
        }

        .modal-footer {
            padding: var(--space-6);
            border-top: 1px solid var(--border);
            display: flex;
            gap: var(--space-3);
            justify-content: flex-end;
        }

        /* Toast Components */
        .toast {
            position: fixed;
            top: var(--space-6);
            right: var(--space-6);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-4) var(--space-6);
            box-shadow: 0 10px 30px var(--shadow-lg);
            z-index: 3000;
            transform: translateX(100%);
            transition: var(--transition);
            max-width: 400px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            border-left: 4px solid var(--success);
        }

        .toast-warning {
            border-left: 4px solid var(--warning);
        }

        .toast-error {
            border-left: 4px solid var(--error);
        }

        .toast-info {
            border-left: 4px solid var(--primary);
        }

        .toast-content {
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
        }

        .toast-icon {
            font-size: var(--text-lg);
            margin-top: var(--space-1);
        }

        .toast-success .toast-icon {
            color: var(--success);
        }

        .toast-warning .toast-icon {
            color: var(--warning);
        }

        .toast-error .toast-icon {
            color: var(--error);
        }

        .toast-info .toast-icon {
            color: var(--primary);
        }

        .toast-message {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: var(--space-1);
        }

        .toast-text {
            color: var(--text-light);
            font-size: var(--text-sm);
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: var(--space-1);
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .toast-close:hover {
            background: var(--background);
            color: var(--text);
        }

        /* Loading Components */
        .loading {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner-large {
            width: 40px;
            height: 40px;
            border-width: 4px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Badge Components */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: var(--space-1) var(--space-3);
            font-size: var(--text-xs);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: var(--radius);
        }

        .badge-primary {
            background: var(--primary);
            color: var(--white);
        }

        .badge-secondary {
            background: var(--secondary);
            color: var(--white);
        }

        .badge-success {
            background: var(--success);
            color: var(--white);
        }

        .badge-warning {
            background: var(--warning);
            color: var(--white);
        }

        .badge-error {
            background: var(--error);
            color: var(--white);
        }

        .badge-neutral {
            background: var(--neutral);
            color: var(--white);
        }

        .badge-outline {
            background: transparent;
            border: 1px solid currentColor;
        }

        /* Progress Components */
        .progress {
            width: 100%;
            height: 8px;
            background: var(--background);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: var(--radius);
            transition: width 0.3s ease;
        }

        .progress-large {
            height: 12px;
        }

        .progress-small {
            height: 4px;
        }

        /* Responsive Design */

        /* Large Desktop */
        @media (min-width: 1400px) {
            .container {
                max-width: 1320px;
            }

            .hero-title {
                font-size: 4rem;
            }

            .section-title {

        /* Desktop */
        @media (max-width: 1199px) {
            .hero-container {
                gap: var(--space-12);
            }

            .features-grid {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

        /* Tablet */

            .hero-title {

            }

            .hero-description {

            .hero-buttons {

            .hero-stats {

            .section-title {

            .events-grid {

                gap: var(--space-6);

            .about {

            }

            }

            .hero-buttons .btn {
                padding: var(--space-3) var(--space-6);
                font-size: var(--text-base);
            }

            .hero-card {
                padding: var(--space-4);
            }

            .card-header {
                font-size: var(--text-base);
            }

            .section-header {
                margin-bottom: var(--space-12);
            }

            .section-title {
                font-size: var(--text-xl);
            }

            .section-description {
                font-size: var(--text-sm);
            }

                padding: var(--space-12) 0;
            }

            .feature-card {
                padding: var(--space-4);
            }

            .feature-icon {
                width: 60px;
                height: 60px;
                font-size: var(--text-2xl);
                margin-bottom: var(--space-4);
            }

            .feature-title {
                font-size: var(--text-lg);
            }

            .feature-description {
                font-size: var(--text-sm);
            }

            .events {
                padding: var(--space-12) 0;
            }

            }

                width: 100%;
                max-width: 200px;
            }

                padding: var(--space-4);
            }

            .event-card-title {
                font-size: var(--text-lg);
            }

            .event-card-footer {
                flex-direction: column;
                gap: var(--space-3);
            }

            .about {
                padding: var(--space-12) 0;
            }

            .about-card {
                padding: var(--space-6);
            }

            .card-icon {
                width: 60px;
                height: 60px;
                font-size: var(--text-2xl);

            .about-card h3 {

            }

            }

            .footer-logo {

            }

            .footer-logo i {
                font-size: var(--text-xl);
            }

        /* Mobile Small */
        @media (max-width: 375px) {
            .container {
                padding: 0 var(--space-2);
            }

            .nav-container {
                padding: 0 var(--space-2);
            }

            .hero-title {
                font-size: var(--text-xl);
            }

            .hero-buttons .btn {
                padding: var(--space-2) var(--space-4);
                font-size: var(--text-sm);
            }

            .stat-number {
                font-size: var(--text-2xl);
            }

            .stat-label {
                font-size: var(--text-xs);
            }

            .section-title {
                font-size: var(--text-lg);
            }

            .feature-card,
            .event-card-content,
            .about-card {
                padding: var(--space-3);
            }

            .feature-icon,
            .card-icon {
                width: 50px;
                height: 50px;
                font-size: var(--text-xl);
            }

            .feature-title,
            .event-card-title,
            .about-card h3 {
                font-size: var(--text-base);
            }

            .modal-content {
                width: 95%;
                margin: var(--space-2);
            }

            .modal-header,
            .modal-body,
            .modal-footer {
                padding: var(--space-4);
            }

            .toast {
                top: var(--space-4);
                right: var(--space-4);
                left: var(--space-4);
                max-width: none;
            }
        }

        /* Form Responsive */
        @media (max-width: 767px) {
            .form-group {
                margin-bottom: var(--space-4);
            }

            .form-input,
            .form-select,
            .form-textarea {
                padding: var(--space-2) var(--space-3);
                font-size: var(--text-sm);
            }

            .btn {
                padding: var(--space-2) var(--space-4);
                font-size: var(--text-sm);
            }

            .btn-large {
                padding: var(--space-3) var(--space-6);
                font-size: var(--text-base);
            }

            .btn-small {
                padding: var(--space-1) var(--space-3);
                font-size: var(--text-xs);
            }
        }

        /* Card Responsive */
        @media (max-width: 575px) {

            .card-header,
            .card-body,
            .card-footer {
                padding: var(--space-4);
            }

            .card-title {
                font-size: var(--text-lg);
            }

            .event-card-image {
                height: 150px;
                font-size: var(--text-3xl);
            }

            .event-card-category {
                font-size: 0.625rem;
                padding: 2px var(--space-2);
            }

            .event-meta-item {
                font-size: var(--text-xs);
            }

            .event-card-price {
                font-size: var(--text-base);
            }
        }

        /* Utility Responsive Classes */
        @media (max-width: 767px) {
            .mobile-hidden {
                display: none !important;
            }

            .mobile-block {
                display: block !important;
            }

            .mobile-flex {
                display: flex !important;
            }

            .mobile-text-center {
                text-align: center !important;
            }

            .mobile-text-left {
                text-align: left !important;
            }

            .mobile-full-width {
                width: 100% !important;
            }
        }

        @media (min-width: 768px) {
            .desktop-hidden {
                display: none !important;
            }

            .desktop-block {
                display: block !important;
            }

            .desktop-flex {
                display: flex !important;
            }
        }

        /* Touch Improvements */
        @media (hover: none) and (pointer: coarse) {

            .btn,
            .nav-link,
            .filter-btn,
            .modal-close,
            .toast-close {
                min-height: 44px;
                min-width: 44px;
            }

            .form-input,
            .form-select,
            .form-textarea {
                min-height: 44px;
            }

            .nav-toggle {
                min-height: 44px;
                min-width: 44px;
                justify-content: center;
                align-items: center;
            }
        }

        /* Landscape Phone */
        @media (max-width: 767px) and (orientation: landscape) {
            .hero {
                padding: 70px 0 var(--space-8);
            }

            .hero-title {
                font-size: var(--text-2xl);
            }

            .hero-description {
                margin-bottom: var(--space-4);
            }

            .hero-buttons {
                margin-bottom: var(--space-6);
            }

            .hero-stats {
                flex-direction: row;
                gap: var(--space-4);
            }

            .features,
            .events,
            .about {
                padding: var(--space-10) 0;
            }
        }

        /* Print Styles */
        @media print {

            .navbar,
            .nav-toggle,
            .hero-buttons,
            .footer,
            .modal,
            .toast {
                display: none !important;
            }

            .hero {
                padding: var(--space-8) 0;
            }

            .section-title {
                color: var(--text) !important;
            }

            .card,
            .feature-card,
            .event-card {
                break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid var(--border) !important;
            }

            a {
                text-decoration: underline !important;
            }

            .btn {
                border: 1px solid var(--border) !important;
                background: transparent !important;
                color: var(--text) !important;
            }
        }

    <!-- Scripts -->
    <script>
        // Event Management System for EventManager

        // Event Manager Class
        class EventManager {
            constructor() {
                this.events = LocalStore.get('events', []);
                this.registrations = LocalStore.get('registrations', []);
            }

            // Create new event
            createEvent(eventData) {
                const event = {
                    id: Utils.generateId(),
                    title: eventData.title,
                    description: eventData.description,
                    date: eventData.date,
                    time: eventData.time,
                    location: eventData.location,
                    category: eventData.category,
                    capacity: parseInt(eventData.capacity),
                    amount: eventData.amount || 0,
                    organizer: eventData.organizer || 'EventManager',
                    registrations: [],
                    status: 'active',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                this.events.push(event);
                this.saveEvents();
                return event;
            }

            // Update event
            updateEvent(eventId, eventData) {
                const eventIndex = this.events.findIndex(e => e.id === eventId);
                if (eventIndex === -1) {
                    throw new Error('Event not found');
                }

                const event = this.events[eventIndex];
                Object.assign(event, eventData, {
                    updatedAt: new Date().toISOString()
                });

                this.saveEvents();
                return event;
            }

            // Delete event
            deleteEvent(eventId) {
                const eventIndex = this.events.findIndex(e => e.id === eventId);
                if (eventIndex === -1) {
                    throw new Error('Event not found');
                }

                // Remove event
                this.events.splice(eventIndex, 1);

                // Remove related registrations
                this.registrations = this.registrations.filter(r => r.eventId !== eventId);

                // Remove related certificates
                const certificates = LocalStore.get('certificates', []);
                const updatedCertificates = certificates.filter(c => c.eventId !== eventId);

                this.saveEvents();
                LocalStore.set('registrations', this.registrations);
                LocalStore.set('certificates', updatedCertificates);

                return true;
            }

            // Get event by ID
            getEvent(eventId) {
                return this.events.find(e => e.id === eventId);
            }

            // Get all events
            getAllEvents() {
                return this.events;
            }

            // Get events by status
            getEventsByStatus(status) {
                return this.events.filter(e => e.status === status);
            }

            // Get events by category
            getEventsByCategory(category) {
                return this.events.filter(e => e.category === category);
            }

            // Get upcoming events
            getUpcomingEvents() {
                const today = new Date().toISOString().split('T')[0];
                return this.events.filter(e => e.date >= today && e.status === 'active');
            }

            // Get past events
            getPastEvents() {
                const today = new Date().toISOString().split('T')[0];
                return this.events.filter(e => e.date < today);
            }

            // Register for event
            registerForEvent(eventId, registrationData) {
                const event = this.getEvent(eventId);
                if (!event) {
                    throw new Error('Event not found');
                }

                if (event.registrations.length >= event.capacity) {
                    throw new Error('Event is full');
                }

                // Check if already registered
                const existingRegistration = this.registrations.find(r =>
                    r.eventId === eventId && r.email === registrationData.email
                );

                if (existingRegistration) {
                    throw new Error('Already registered for this event');
                }
                document.body.appendChild(registration.payment.qrCode);

                const registration = {
                    id: Utils.generateId(),
                    eventId: eventId,
                    name: registrationData.name,
                    email: registrationData.email,
                    phone: registrationData.phone,
                    organization: registrationData.organization,
                    registrationDate: new Date().toISOString(),
                    status: 'confirmed',
                    certificateIssued: false,
                    payment: {
                        amount: 500,
                        status: 'pending',
                        qrCode: (() => {
                            const img = document.createElement("img");
                            img.src = "/assets/payment-qr.png";   // path to your QR image
                            img.alt = "Payment QR Code";
                            img.width = 200;
                            return img;  // store the <img> element itself
                        })(),
                        link: 'upi://pay?pa=yourupi@upi&pn=EventOrg&am=500&cu=INR'
                    }
                };

                this.registrations.push(registration);
                event.registrations.push(registration.id);

                this.saveEvents();
                this.saveEvents();
                LocalStore.set('registrations', this.registrations);

                return registration;
            }

            // Get event registrations
            getEventRegistrations(eventId) {
                return this.registrations.filter(r => r.eventId === eventId);
            }

            // Get registration by ID
            getRegistration(registrationId) {
                return this.registrations.find(r => r.id === registrationId);
            }

            // Cancel registration
            cancelRegistration(registrationId) {
                const registrationIndex = this.registrations.findIndex(r => r.id === registrationId);
                if (registrationIndex === -1) {
                    throw new Error('Registration not found');
                }

                const registration = this.registrations[registrationIndex];
                const event = this.getEvent(registration.eventId);

                if (event) {
                    event.registrations = event.registrations.filter(id => id !== registrationId);
                }

                this.registrations.splice(registrationIndex, 1);

                this.saveEvents();
                this.saveEvents();
                LocalStore.set('registrations', this.registrations);

                return true;
            }

            // Get event statistics
            getEventStats(eventId) {
                const event = this.getEvent(eventId);
                if (!event) {
                    throw new Error('Event not found');
                }

                const registrations = this.getEventRegistrations(eventId);
                const certificates = LocalStore.get('certificates', []).filter(c => c.eventId === eventId);

                return {
                    event: event,
                    totalRegistrations: registrations.length,
                    availableSpots: event.capacity - registrations.length,
                    certificatesIssued: certificates.length,
                    registrationRate: (registrations.length / event.capacity) * 100,
                    registrations: registrations,
                    certificates: certificates
                };
            }

            // Search events
            searchEvents(query) {
                const lowercaseQuery = query.toLowerCase();
                return this.events.filter(event =>
                    event.title.toLowerCase().includes(lowercaseQuery) ||
                    event.description.toLowerCase().includes(lowercaseQuery) ||
                    event.location.toLowerCase().includes(lowercaseQuery) ||
                    event.category.toLowerCase().includes(lowercaseQuery)
                );
            }

            // Filter events
            filterEvents(filters) {
                let filteredEvents = this.events;

                if (filters.category && filters.category !== 'all') {
                    filteredEvents = filteredEvents.filter(e => e.category === filters.category);
                }

                if (filters.status && filters.status !== 'all') {
                    filteredEvents = filteredEvents.filter(e => e.status === filters.status);
                }

                if (filters.dateFrom) {
                    filteredEvents = filteredEvents.filter(e => e.date >= filters.dateFrom);
                }

                if (filters.dateTo) {
                    filteredEvents = filteredEvents.filter(e => e.date <= filters.dateTo);
                }

                if (filters.location) {
                    const locationQuery = filters.location.toLowerCase();
                    filteredEvents = filteredEvents.filter(e =>
                        e.location.toLowerCase().includes(locationQuery)
                    );
                }

                return filteredEvents;
            }

            // Export events to CSV
            exportEventsToCSV() {
                const headers = ['Title', 'Description', 'Date', 'Time', 'Location', 'Category', 'Capacity', 'Registrations', 'Status'];
                const rows = this.events.map(event => [
                    event.title,
                    event.description,
                    event.date,
                    event.time,
                    event.location,
                    event.category,
                    event.capacity,
                    event.registrations.length,
                    event.status
                ]);

                const csvContent = [headers, ...rows]
                    .map(row => row.map(field => `"${field}"`).join(','))
                    .join('\n');

                Utils.downloadFile(csvContent, 'events.csv', 'text/csv');
            }

            // Export registrations to CSV
            exportRegistrationsToCSV(eventId = null) {
                let registrations = this.registrations;

                if (eventId) {
                    registrations = registrations.filter(r => r.eventId === eventId);
                }

                const headers = ['Name', 'Email', 'Phone', 'Organization', 'Event', 'Registration Date', 'Status', 'Certificate Issued'];
                const rows = registrations.map(registration => {
                    const event = this.getEvent(registration.eventId);
                    return [
                        registration.name,
                        registration.email,
                        registration.phone || '',
                        registration.organization || '',
                        event ? event.title : 'Unknown Event',
                        Utils.formatDate(registration.registrationDate),
                        registration.status,
                        registration.certificateIssued ? 'Yes' : 'No'
                    ];
                });

                const csvContent = [headers, ...rows]
                    .map(row => row.map(field => `"${field}"`).join(','))
                    .join('\n');

                const filename = eventId ? `registrations_${eventId}.csv` : 'all_registrations.csv';
                Utils.downloadFile(csvContent, filename, 'text/csv');
            }

            // Get dashboard statistics
            getDashboardStats() {
                const today = new Date().toISOString().split('T')[0];
                const certificates = LocalStore.get('certificates', []);

                return {
                    totalEvents: this.events.length,
                    activeEvents: this.events.filter(e => e.status === 'active').length,
                    upcomingEvents: this.events.filter(e => e.date >= today && e.status === 'active').length,
                    pastEvents: this.events.filter(e => e.date < today).length,
                    totalRegistrations: this.registrations.length,
                    totalCertificates: certificates.length,
                    recentEvents: this.events
                        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                        .slice(0, 5),
                    recentRegistrations: this.registrations
                        .sort((a, b) => new Date(b.registrationDate) - new Date(a.registrationDate))
                        .slice(0, 10)
                };
            }

            // Validate event data
            validateEventData(eventData) {
                const errors = {};

                if (!eventData.title || eventData.title.trim() === '') {
                    errors.title = 'Event title is required';
                }

                if (!eventData.description || eventData.description.trim() === '') {
                    errors.description = 'Event description is required';
                }

                if (!eventData.date) {
                    errors.date = 'Event date is required';
                } else {
                    const eventDate = new Date(eventData.date);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);

                    if (eventDate < today) {
                        errors.date = 'Event date cannot be in the past';
                    }
                }

                if (!eventData.time) {
                    errors.time = 'Event time is required';
                }

                if (!eventData.location || eventData.location.trim() === '') {
                    errors.location = 'Event location is required';
                }

                if (!eventData.category) {
                    errors.category = 'Event category is required';
                }

                if (!eventData.capacity || eventData.capacity < 1) {
                    errors.capacity = 'Event capacity must be at least 1';
                }

                return Object.keys(errors).length === 0 ? null : errors;
            }

            // Save events to storage
            saveEvents() {
                LocalStore.set('events', this.events);
            }

            // Refresh data from storage
            refreshData() {
                this.events = LocalStore.get('events', []);
                this.registrations = LocalStore.get('registrations', []);
            }
        }

        // Initialize event manager
        const eventManager = new EventManager();

        // Export for use in other files
        if (typeof module !== 'undefined' && module.exports) {
            module.exports = { EventManager };
        }
        // Utility Functions for EventManager

        // Local Storage Helper Functions
        const LocalStore = {
            // Get data from localStorage
            get(key, defaultValue = null) {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (error) {
                    console.error('Error getting data from localStorage:', error);
                    return defaultValue;
                }
            },

            // Set data to localStorage
            set(key, value) {
                try {
                    console.log(`Setting data for key "${key}":`, value);
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (error) {
                    console.error('Error setting data to localStorage:', error);
                    return false;
                }
            },

            // Remove data from localStorage
            remove(key) {
                try {
                    localStorage.removeItem(key);
                    return true;
                } catch (error) {
                    console.error('Error removing data from localStorage:', error);
                    return false;
                }
            },

            // Clear all data from localStorage
            clear() {
                try {
                    localStorage.clear();
                    return true;
                } catch (error) {
                    console.error('Error clearing localStorage:', error);
                    return false;
                }
            }
        };

        // ID Generation
        const Utils = {
            // Generate unique ID
            generateId() {
                return 'id_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            },

            // Format date to readable string
            formatDate(date, options = {}) {
                const defaultOptions = {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                };
                const formatOptions = { ...defaultOptions, ...options };

                try {
                    return new Date(date).toLocaleDateString('en-US', formatOptions);
                } catch (error) {
                    console.error('Error formatting date:', error);
                    return 'Invalid Date';
                }
            },

            // Format time to readable string
            formatTime(time) {
                try {
                    const [hours, minutes] = time.split(':');
                    const date = new Date();
                    date.setHours(parseInt(hours), parseInt(minutes));
                    return date.toLocaleTimeString('en-US', {
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });
                } catch (error) {
                    console.error('Error formatting time:', error);
                    return 'Invalid Time';
                }
            },

            // Validate email format
            isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            },

            // Validate phone format
            isValidPhone(phone) {
                const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
                return phoneRegex.test(phone.replace(/[\s\-\(\)]/g, ''));
            },

            // Sanitize HTML to prevent XSS
            sanitizeHtml(str) {
                const temp = document.createElement('div');
                temp.textContent = str;
                return temp.innerHTML;
            },

            // Truncate text with ellipsis
            truncateText(text, maxLength = 100) {
                if (text.length <= maxLength) return text;
                return text.substr(0, maxLength) + '...';
            },

            // Debounce function
            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },

            // Throttle function
            throttle(func, limit) {
                let inThrottle;
                return function () {
                    const args = arguments;
                    const context = this;
                    if (!inThrottle) {
                        func.apply(context, args);
                        inThrottle = true;
                        setTimeout(() => inThrottle = false, limit);
                    }
                };
            },

            // Copy text to clipboard
            async copyToClipboard(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (error) {
                    console.error('Error copying to clipboard:', error);
                    return false;
                }
            },

            // Download file
            downloadFile(content, filename, contentType = 'text/plain') {
                const blob = new Blob([content], { type: contentType });
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;

        // Toast Notification System

            show(message, type = 'info', duration = 5000) {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;

                const iconMap = {
                    success: 'fas fa-check-circle',
                    error: 'fas fa-exclamation-circle',
                    warning: 'fas fa-exclamation-triangle',
                    info: 'fas fa-info-circle'
                };

                toast.innerHTML = `
            <div class="toast-content">
                <i class="toast-icon ${iconMap[type]}"></i>
                <div class="toast-message">
                    <div class="toast-text">${Utils.sanitizeHtml(message)}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;

                document.body.appendChild(toast);

                // Show toast
                setTimeout(() => toast.classList.add('show'), 100);

                // Auto remove toast
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (toast.parentElement) {
                            toast.parentElement.removeChild(toast);
                        }
                    }, 300);
                }, duration);

                return toast;
            },

            success(message, duration) {
                return this.show(message, 'success', duration);

            error(message, duration) {

        // Modal System

            // Show modal
            show(content, title = '', options = {}) {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">${Utils.sanitizeHtml(title)}</h3>
                    <button class="modal-close" onclick="Modal.hide(this)">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    ${content}
                </div>
                ${options.footer ? `<div class="modal-footer">${options.footer}</div>` : ''}
            </div>
        `;

                document.body.appendChild(modal);

                // Show modal
                setTimeout(() => modal.classList.add('active'), 100);

                // Close on backdrop click
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        this.hide(modal);
                    }
                });

                // Close on escape key
                const handleEscape = (e) => {
                    if (e.key === 'Escape') {
                        this.hide(modal);
                        document.removeEventListener('keydown', handleEscape);
                    }
                };
                document.addEventListener('keydown', handleEscape);

                return modal;
            },

            // Hide modal
            hide(modal) {
                if (typeof modal === 'string') {
                    modal = document.querySelector(modal);
                } else if (modal.classList && modal.classList.contains('modal-close')) {
                    modal = modal.closest('.modal');
                }

                if (modal) {
                    modal.classList.remove('active');
                    setTimeout(() => {
                        if (modal.parentElement) {
                            modal.parentElement.removeChild(modal);
                        }
                    }, 300);
                }

            confirm(message, title = 'Confirm', onConfirm = null, onCancel = null) {

            <button class="btn btn-primary" onclick="Modal.hide(this); ${onConfirm ? 'onConfirm()' : ''}">Confirm</button>

        // Form Validation
        const Validator = {
            // Validate required field
            required(value, message = 'This field is required') {
                return value && value.trim() !== '' ? null : message;
            },

            // Validate email
            email(value, message = 'Please enter a valid email address') {
                return !value || Utils.isValidEmail(value) ? null : message;
            },

            // Validate phone
            phone(value, message = 'Please enter a valid phone number') {
                return !value || Utils.isValidPhone(value) ? null : message;
            },

            // Validate minimum length
            minLength(value, min, message = `Minimum ${min} characters required`) {
                return !value || value.length >= min ? null : message;
            },

            // Validate maximum length
            maxLength(value, max, message = `Maximum ${max} characters allowed`) {
                return !value || value.length <= max ? null : message;
            },

            // Validate number
            number(value, message = 'Please enter a valid number') {
                return !value || !isNaN(value) ? null : message;
            },

            // Validate date
            date(value, message = 'Please enter a valid date') {
                return !value || !isNaN(Date.parse(value)) ? null : message;
            },

            // Validate form
            validateForm(formData, rules) {
                const errors = {};

                for (const field in rules) {
                    const value = formData[field];
                    const fieldRules = rules[field];

                    for (const rule of fieldRules) {
                        const error = this[rule.type](value, rule.message, ...rule.params || []);
                        if (error) {
                            errors[field] = error;
                            break;
                        }
                    }
                }

                return Object.keys(errors).length === 0 ? null : errors;
            }

        // Animation Helpers
        const Animation = {
            // Fade in element
            fadeIn(element, duration = 300) {
                element.style.opacity = '0';
                element.style.display = 'block';

                let start = null;
                function animate(timestamp) {
                    if (!start) start = timestamp;
                    const progress = timestamp - start;
                    const opacity = Math.min(progress / duration, 1);

                    element.style.opacity = opacity;

                    if (progress < duration) {
                        requestAnimationFrame(animate);
                    }
                }

                requestAnimationFrame(animate);
            },

            // Fade out element
            fadeOut(element, duration = 300) {
                let start = null;
                function animate(timestamp) {
                    if (!start) start = timestamp;
                    const progress = timestamp - start;
                    const opacity = Math.max(1 - (progress / duration), 0);

                    element.style.opacity = opacity;

                    if (progress < duration) {
                        requestAnimationFrame(animate);
                    } else {
                        element.style.display = 'none';
                    }
                }

                requestAnimationFrame(animate);
            },

            // Slide down element
            slideDown(element, duration = 300) {
                element.style.height = '0';
                element.style.overflow = 'hidden';
                element.style.display = 'block';

                const targetHeight = element.scrollHeight;

                let start = null;
                function animate(timestamp) {
                    if (!start) start = timestamp;
                    const progress = timestamp - start;
                    const height = Math.min((progress / duration) * targetHeight, targetHeight);

                    element.style.height = height + 'px';

                    if (progress < duration) {
                        requestAnimationFrame(animate);
                    } else {
                        element.style.height = '';
                        element.style.overflow = '';
                    }
                }

                requestAnimationFrame(animate);
            },

            // Slide up element
            slideUp(element, duration = 300) {
                const startHeight = element.offsetHeight;
                element.style.overflow = 'hidden';

                let start = null;
                function animate(timestamp) {
                    if (!start) start = timestamp;
                    const progress = timestamp - start;
                    const height = Math.max(startHeight - ((progress / duration) * startHeight), 0);

                    element.style.height = height + 'px';

                    if (progress < duration) {
                        requestAnimationFrame(animate);
                    } else {
                        element.style.display = 'none';
                        element.style.height = '';
                        element.style.overflow = '';
                    }
                }

                requestAnimationFrame(animate);
            }
        };
