<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuantrixConduct</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3225eb;
            --primary-dark: #1D4ED8;
            --secondary: #7C3AED;
            --success: #10B981;
            --error: #EF4444;
            --text: #111827;
            --text-light: #6B7280;
            --white: #FFFFFF;
            --background: #F9FAFB;
            --border: #E5E7EB;
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-lg: rgba(0, 0, 0, 0.15);
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-secondary: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--font-primary);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: var(--white);
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px var(--shadow-lg);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .login-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .login-title {
            font-family: var(--font-secondary);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.95rem;
            opacity: 0.95;
        }

        .login-body {
            padding: 2.5rem 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            font-size: 1rem;
            font-family: var(--font-primary);
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(50, 37, 235, 0.1);
        }

        .form-input.error {
            border-color: var(--error);
        }

        .error-message {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .credentials-info {
            background: var(--background);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .credentials-info h4 {
            font-family: var(--font-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.75rem;
        }

        .credential-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border);
        }

        .credential-item:last-child {
            border-bottom: none;
        }

        .credential-label {
            color: var(--text-light);
            font-weight: 500;
        }

        .credential-value {
            color: var(--text);
            font-family: monospace;
            font-weight: 600;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: var(--primary-dark);
            gap: 0.75rem;
        }

        @media (max-width: 576px) {
            .login-container {
                border-radius: 1rem;
            }

            .login-header {
                padding: 2rem 1.5rem;
            }

            .login-body {
                padding: 2rem 1.5rem;
            }

            .login-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                border-radius: 0.75rem;
                box-shadow: none;
                /* Simplifies look on mobile */
                border: 1px solid var(--border);
            }

            .login-header {
                padding: 1.5rem 1rem;
            }

            .login-body {
                padding: 1.5rem 1rem;
            }

            .login-logo {
                font-size: 2.5rem;
            }

            .login-title {
                font-size: 1.25rem;
            }

            .form-input {
                padding: 0.75rem;
                font-size: 16px;
                /* Prevents iOS zoom */
            }

            .btn {
                padding: 0.875rem;
            }
        }


        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-university"></i>
            </div>
            <h1 class="login-title" id="page-title">Welcome Back</h1>
            <p class="login-subtitle">QuantrixConduct Event Manager</p>
        </div>

        <div class="login-body">
            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                    <div class="error-message" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            required>
                        <i class="fas fa-eye toggle-password" id="toggle-password"></i>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>

                <div class="error-message" id="form-error"></div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login</span>
                </button>
            </form>

            <form id="signup-form" style="display: none;">
                <div class="form-group">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input type="text" id="signup-name" class="form-input" placeholder="Enter your name" required>
                    <div class="error-message" id="name-error"></div>
                </div>

                <div class="form-group">
                    <label for="signup-email" class="form-label">Email Address</label>
                    <input type="email" id="signup-email" class="form-input" placeholder="Enter your email" required>
                    <div class="error-message" id="signup-email-error"></div>
                </div>

                <div class="form-group">
                    <label for="signup-password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signup-password" class="form-input" placeholder="Create a password"
                            required>
                        <i class="fas fa-eye toggle-password" id="toggle-signup-password"></i>
                    </div>
                    <div class="error-message" id="signup-password-error"></div>
                </div>

                <div class="error-message" id="signup-form-error"></div>

                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <i class="fas fa-user-plus"></i>
                    <span>Sign Up</span>
                </button>
            </form>

            <div class="divider">OR</div>

            <div class="back-link">
                <a href="#" id="toggle-auth">Don't have an account? Sign Up</a>
            </div>



            <div class="back-link">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const formError = document.getElementById('form-error');

        const signupName = document.getElementById('signup-name');
        const signupEmail = document.getElementById('signup-email');
        const signupPassword = document.getElementById('signup-password');
        const signupBtn = document.getElementById('signup-btn');
        const signupError = document.getElementById('signup-form-error');

        const toggleAuthBtn = document.getElementById('toggle-auth');
        const pageTitle = document.getElementById('page-title');

        // Password Toggle Logic
        function setupPasswordToggle(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);

            toggle.addEventListener('click', () => {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);

                // Toggle icon class
                toggle.classList.toggle('fa-eye');
                toggle.classList.toggle('fa-eye-slash');
            });
        }

        setupPasswordToggle('password', 'toggle-password');
        setupPasswordToggle('signup-password', 'toggle-signup-password');

        // Toggle Login/Signup
        toggleAuthBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (loginForm.style.display !== 'none') {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                pageTitle.textContent = 'Create Account';
                toggleAuthBtn.textContent = 'Already have an account? Login';
            } else {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                pageTitle.textContent = 'Welcome Back';
                toggleAuthBtn.textContent = "Don't have an account? Sign Up";
            }
        });

        // Handle Signup submission
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear errors
            signupError.classList.remove('show');
            signupError.textContent = '';
            signupName.classList.remove('error');
            signupEmail.classList.remove('error');
            signupPassword.classList.remove('error');

            const name = signupName.value.trim();
            const email = signupEmail.value.trim();
            const password = signupPassword.value.trim();

            if (!name || !email || !password) {
                signupError.textContent = 'Please fill in all fields';
                signupError.classList.add('show');
                return;
            }

            signupBtn.disabled = true;
            signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            // Simulate slight delay for better UX
            await new Promise(r => setTimeout(r, 500));

            const result = await auth.register(name, email, password);

            if (result.success) {
                alert(result.message);
                // Switch to login view (Redirect to login page)
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                pageTitle.textContent = 'Welcome Back';
                toggleAuthBtn.textContent = "Don't have an account? Sign Up";
                // Pre-fill email
                emailInput.value = email;
                passwordInput.value = '';
                signupForm.reset();
            } else {
                signupError.textContent = result.message;
                signupError.classList.add('show');
            }

            signupBtn.disabled = false;
            signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> <span>Sign Up</span>';
        });

        // Handle Login submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous errors
            formError.classList.remove('show');
            formError.textContent = '';
            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');

            // Get form values
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Validate
            if (!email || !password) {
                formError.textContent = 'Please fill in all fields';
                formError.classList.add('show');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            await new Promise(r => setTimeout(r, 500));

            const result = await auth.login(email, password);

            if (result.success) {
                // Success - redirect to home page
                // The home page will show/hide Dashboard link based on role
                window.location.href = '../index.html';
            } else {
                // Failed
                formError.textContent = result.message;
                formError.classList.add('show');
                emailInput.classList.add('error');
                passwordInput.classList.add('error');

                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Login</span>';
            }
        });

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            if (auth.isLoggedIn()) {
                const user = auth.getCurrentUser();
                // Instead of auto-redirecting, show a message/prompt
                // This prevents infinite loops if localStorage isn't shared (e.g. file:// protocol)

                const roleDest = user.role === 'admin' ? 'dashboard.html' : '../index.html';

                // Hide forms
                loginForm.style.display = 'none';
                signupForm.style.display = 'none';
                // Hide keys/toggle
                if (toggleAuthBtn && toggleAuthBtn.parentElement) {
                    toggleAuthBtn.parentElement.style.display = 'none';
                }
                document.querySelector('.divider').style.display = 'none';
                document.querySelector('.credentials-info').style.display = 'none';

                // Show already logged in message
                const container = document.querySelector('.login-body');
                const msgDiv = document.createElement('div');
                msgDiv.style.textAlign = 'center';
                msgDiv.innerHTML = `
                    <div style="margin-bottom: 1.5rem;">
                        <i class="fas fa-user-check" style="font-size: 3rem; color: var(--success);"></i>
                    </div>
                    <h3>Welcome back, ${user.name}!</h3>
                    <p style="color: var(--text-light); margin-bottom: 2rem;">You are already logged in.</p>
                    
                    <a href="${roleDest}" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                        Continue to App
                    </a>
                    
                    <button onclick="auth.logout()" class="btn btn-secondary" style="width: 100%; background-color: #f3f4f6; color: var(--text);">
                        Logout
                    </button>
                `;
                // Insert before the generic back link at the bottom
                const bottomBackLink = container.lastElementChild;
                container.insertBefore(msgDiv, bottomBackLink);

                // Update page title
                pageTitle.textContent = 'Already Logged In';
            }
        });
    </script>
</body>

</html>
